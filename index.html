<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fleet Trip 360</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./reports/premium.css?v=0.1.3" media="print"/>
<script src="./print-options.js?v=0.1.3"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body{margin:0;padding:0;background:#f5f8fc;color:#172033;font-family:'Segoe UI',system-ui,sans-serif} .map{height:420px;border-radius:12px;border:1px solid #e5eaf1}</style>
</head>
<body>
<div id="app"><div style="padding:40px;color:#64748b;font-size:13px">Carregando Fleet Trip 360...</div></div>
<script>
'use strict';
const DAY_MS=86400000;
let apiRef=null,map=null,layer=null,vehicles=[],trips=[],logs=[],events=[],changes=[],rules=[],drivers=[],selectedDevice=null,loadToken=0,expandedEvents={};
const $=id=>document.getElementById(id);
const call=(api,t,s)=>new Promise((ok,err)=>api.call('Get',{typeName:t,search:s||{}},ok,err));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function parseDurationMs(d){if(d==null||d==="")return 0;const str=String(d);const m=str.match(/^(?:(\d+)\.)?(\d{1,2}):(\d{2}):(\d{2})(?:\.\d+)?$/);if(m){const days=Number(m[1]||0);return(days*86400+Number(m[2]||0)*3600+Number(m[3]||0)*60+Number(m[4]||0))*1000}const n=Number(d);return isNaN(n)?0:n}
function fmtDate(d){try{return new Date(d).toLocaleString('pt-BR')}catch(e){return String(d||'')}}
function fmtNum(n){return Number(n||0).toLocaleString('pt-BR')}
function currentRange(){const fromEl=$('dateFrom'),toEl=$('dateTo');let from=fromEl&&fromEl.value?new Date(fromEl.value):null,to=toEl&&toEl.value?new Date(toEl.value):null;if(!from||isNaN(from.getTime())){const days=Number($('periodFilter').value)||1;to=to&&!isNaN(to.getTime())?to:new Date();from=new Date(to.getTime()-days*DAY_MS)}if(!to||isNaN(to.getTime()))to=new Date();if(from.getTime()>to.getTime()){const tmp=from;from=to;to=tmp}return{from,to}}
function shell(){
$('app').innerHTML=`<div class="head"><div class="title"><strong>Fleet Trip 360</strong><div class="sub">Historico real de viagens - MyGeotab</div></div><div class="pill" id="statusBox">Conectando...</div></div>
<div class="bar">
<input id="deviceQuery" list="deviceList" placeholder="Placa ou nome do veiculo" style="min-width:260px"/><datalist id="deviceList"></datalist>
<select id="periodFilter"><option value="1" selected>Hoje</option><option value="7">7 dias</option><option value="custom">Personalizado</option></select>
<label class="datefield">De <input type="datetime-local" id="dateFrom"/></label>
<label class="datefield">Ate <input type="datetime-local" id="dateTo"/></label>
<button class="primary" id="loadBtn">Consultar</button>
<button id="clearBtn">Limpar</button>
<button id="pdfBtn">Exportar PDF</button>
</div>
<div class="info"><span>Veiculos: <b id="countBox">0</b></span><span>Viagens: <b id="tripCount">0</b></span><span>Distancia: <b id="distanceKm">0</b> km</span></div>
<div id="alertBox" class="alert" style="display:none"></div>
<div id="kpisBox" class="grid"></div>
<div class="cols" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="panel"><div class="pt">Mapa do historico</div><div id="mapBox" class="map"></div></div>
<div class="panel"><div class="pt">Viagens</div><div id="tripsBox"></div></div>
</div>
<div class="panel"><div class="pt">Excecoes agrupadas</div><div id="eventsBox"></div></div>
<footer class="project-credit">Desenvolvido por Bruno Henrique Felisbino Goncalves</footer>`;
$('loadBtn').onclick=()=>loadHistory(apiRef);
$('clearBtn').onclick=clearFilters;
$('pdfBtn').onclick=()=>exportPdf();
$('periodFilter').onchange=()=>{setRangeFromPeriod();};
setRangeFromPeriod();
if(!document.getElementById('pdfStage')){const s=document.createElement('div');s.id='pdfStage';s.className='pdf-stage';s.style.display='none';document.body.appendChild(s)}
}
function setRangeFromPeriod(){const days=Number($('periodFilter').value)||1;const to=new Date();const from=new Date(to.getTime()-days*DAY_MS);$('dateFrom').value=toLocalInput(from);$('dateTo').value=toLocalInput(to)}
function toLocalInput(d){const pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
async function loadDevices(){try{const devs=await call(apiRef,'Device',{});vehicles=devs||[];$('countBox').textContent=vehicles.length;const dl=$('deviceList');dl.innerHTML=vehicles.map(d=>`<option value="${esc(d.id)}">${esc(d.name||d.id)} ${d.licensePlate?'- '+esc(d.licensePlate):''}</option>`).join('')}catch(e){console.error(e);alertMsg('Erro ao carregar veiculos: '+(e.message||''),false,true)}}
async function loadHistory(api){if(!api){alertMsg('Abra dentro do MyGeotab.',false,true);return}const q=($('deviceQuery').value||'').toLowerCase().trim();const found=vehicles.find(v=>((v.name||'')+' '+(v.licensePlate||'')).toLowerCase().includes(q)||v.id===q);const id=found?found.id:'';if(!id){alertMsg('Selecione um veiculo valido.',false,true);return}selectedDevice=vehicles.find(v=>v.id===id);const range=currentRange();const token=++loadToken;setStatus('Consultando viagens...');try{const [tr,lr,ee,dc,rl,dv]=await Promise.all([call(api,'Trip',{deviceSearch:{id:id},fromDate:range.from.toISOString(),toDate:range.to.toISOString(),includeOverlappedTrips:true}).catch(()=>[]),call(api,'LogRecord',{deviceSearch:{id:id},fromDate:range.from.toISOString(),toDate:range.to.toISOString()}).catch(()=>[]),call(api,'ExceptionEvent',{deviceSearch:{id:id},fromDate:range.from.toISOString(),toDate:range.to.toISOString(),includeExceptionCount:true}).catch(()=>[]),call(api,'DriverChange',{deviceSearch:{id:id},fromDate:range.from.toISOString(),toDate:range.to.toISOString(),includeOverlappedChanges:true}).catch(()=>[]),call(api,'Rule',{}).catch(()=>[]),call(api,'Driver',{}).catch(()=>[])]);if(token!==loadToken)return;trips=tr||[];changes=dc||[];rules=rl||[];drivers=dv||[];logs=(lr||[]).sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime));events=ee||[];render();setStatus(trips.length+' viagens carregadas');alertMsg('Consulta concluida.',true)}catch(e){console.error(e);setStatus('Erro');alertMsg('Erro: '+(e.message||''),false,true)}}
function ruleName(id){const r=rules.find(x=>x.id===id);return r&&r.name?r.name:'Regra'}
function driverName(id){const d=drivers.find(x=>x.id===id);return d&&d.name?d.name:id}
function render(){renderKpis();renderTrips();renderEvents();renderMap()}
function renderKpis(){const official=trips.reduce((s,t)=>s+Number(t.distance||t.Distance||0),0)/1000;let dist=official;if(!dist&&logs.length>1){let km=0;for(let i=1;i<logs.length;i++){const a=logs[i-1],b=logs[i];const R=6371,dLat=(Number(b.latitude)-Number(a.latitude))*Math.PI/180,dLng=(Number(b.longitude)-Number(a.longitude))*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(Number(a.latitude)*Math.PI/180)*Math.cos(Number(b.latitude)*Math.PI/180)*Math.sin(dLng/2)**2;km+=R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}dist=km}const drive=trips.reduce((s,t)=>s+parseDurationMs(t.drivingDuration),0);const stop=trips.reduce((s,t)=>s+parseDurationMs(t.stopDuration),0);$('tripCount').textContent=trips.length;$('distanceKm').textContent=dist.toFixed(1)+(official?'':' (est.)');$('kpisBox').innerHTML=[['Viagens',trips.length,'periodo','var(--blue)'],['Distancia',dist.toFixed(1)+' km',official?'oficial':'estimado GPS','var(--green)'],['Tempo dirigindo',Math.round(drive/60000)+' min','Trip','var(--blue)'],['Tempo parado',Math.round(stop/60000)+' min','Trip','var(--orange)'],['Excecoes',events.length,'periodo','var(--red)']].map(c=>`<div class="kpi"><span>${c[0]}</span><b style="color:${c[3]}">${c[1]}</b><small>${c[2]}</small></div>`).join('')}
function renderTrips(){$('tripsBox').innerHTML=trips.length?trips.map((t,i)=>`<div style="padding:8px;border-bottom:1px solid #e5eaf1"><b>#${i+1}</b> ${fmtDate(t.start)} -> ${fmtDate(t.stop)}<br><small>Condutor: ${esc((t.driver && driverName(t.driver.id)) || "Nao identificado")} - ${(Number(t.distance||t.Distance||0)/1000).toFixed(1)} km - media ${Math.round(t.averageSpeed||0)} km/h - max ${Math.round(t.maximumSpeed||0)} km/h - excecoes ${t.exceptionCount||0}</small></div>`).join(''):'<div style="padding:20px;text-align:center;color:#64748b">Sem viagens.</div>'}
function renderEvents(){if(!events.length){$('eventsBox').innerHTML='<div style="padding:20px;text-align:center;color:#64748b">Sem excecoes.</div>';return}const groups={};events.forEach(e=>{const k=ruleName(e.rule&&e.rule.id);(groups[k]||(groups[k]=[])).push(e)});$('eventsBox').innerHTML=Object.keys(groups).map(k=>{const list=groups[k],total=list.reduce((s,e)=>s+parseDurationMs(e.duration),0),open=!!expandedEvents[k];return `<div style="border-bottom:1px solid #e5eaf1"><div style="padding:8px;cursor:pointer;font-weight:700" onclick="expandedEvents['${k}']=!expandedEvents['${k}'];render()">${esc(k)} - ${list.length} ocorrencia(s) - ${Math.round(total/1000)}s ${open?'[-]':'[+]'}</div>${open?list.map(e=>`<div style="padding:6px 12px;font-size:12px">${fmtDate(e.activeFrom)} - ${Math.round(parseDurationMs(e.duration)/1000)}s${e.maximumSpeed?` - ${Math.round(e.maximumSpeed)} km/h`:''}</div>`).join(''):''}</div>`}).join('')}
function renderMap(){if(!map){map=L.map('mapBox');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}layer.clearLayers();const pts=logs.map(r=>[Number(r.latitude),Number(r.longitude)]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(pts.length){const poly=L.polyline(pts,{color:'#0ea5e9',weight:3}).addTo(layer);map.fitBounds(poly.getBounds(),{padding:[20,20]});if(pts[0])L.marker(pts[0]).addTo(layer).bindPopup('Inicio');if(pts[pts.length-1])L.marker(pts[pts.length-1]).addTo(layer).bindPopup('Termino')}events.forEach(e=>{const lr=nearestLog(e.activeFrom);if(!lr)return;const m=L.circleMarker([Number(lr.latitude),Number(lr.longitude)],{radius:6,color:'#ef4444',fillColor:'#ef4444',fillOpacity:.8}).addTo(layer);m.bindPopup(esc(ruleName(e.rule&&e.rule.id))+'<br>'+fmtDate(e.activeFrom))})}
function nearestLog(dt){if(!logs.length||!dt)return null;const t=new Date(dt).getTime();let best=null,diff=Infinity;logs.forEach(r=>{const d=Math.abs(new Date(r.dateTime).getTime()-t);if(d<diff){diff=d;best=r}});return diff<=300000?best:null}
function clearFilters(){$('deviceQuery').value='';$('periodFilter').value='1';setRangeFromPeriod();trips=[];logs=[];events=[];render()}
function setStatus(t){const e=$('statusBox');if(e)e.textContent=t}
function alertMsg(t,ok,err){const e=$('alertBox');if(!e)return;e.style.display='block';e.className='alert'+(ok?' ok':err?' err':'');e.textContent=t}
function tripDistance(){const official=trips.reduce((s,t)=>s+Number(t.distance||t.Distance||0),0)/1000;let dist=official;if(!dist&&logs.length>1){let km=0;for(let i=1;i<logs.length;i++){const a=logs[i-1],b=logs[i];const R=6371,dLat=(Number(b.latitude)-Number(a.latitude))*Math.PI/180,dLng=(Number(b.longitude)-Number(a.longitude))*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(Number(a.latitude)*Math.PI/180)*Math.cos(Number(b.latitude)*Math.PI/180)*Math.sin(dLng/2)**2;km+=R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}dist=km}return{official,dist}}
function buildTripPdf(){const td=tripDistance();const drive=trips.reduce((s,t)=>s+parseDurationMs(t.drivingDuration),0);const stop=trips.reduce((s,t)=>s+parseDurationMs(t.stopDuration),0);const vehicle=selectedDevice?(esc(selectedDevice.name||selectedDevice.id)+(selectedDevice.licensePlate?' - '+esc(selectedDevice.licensePlate):'')):'-';const range=currentRange();const generatedAt=new Date().toLocaleString('pt-BR');const tripRows=trips.map((t,i)=>`<tr><td>${i+1}</td><td>${fmtDate(t.start)}</td><td>${fmtDate(t.stop)}</td><td>${esc(driverName(t.driver&&t.driver.id))}</td><td>${(Number(t.distance||t.Distance||0)/1000).toFixed(1)}</td><td>${Math.round(t.averageSpeed||0)}</td><td>${Math.round(t.maximumSpeed||0)}</td><td>${t.exceptionCount||0}</td></tr>`).join('');const pointRows=trips.map((t,i)=>{const sl=nearestLog(t.start);const el=nearestLog(t.stop);const sc=sl?Number(sl.latitude).toFixed(5)+', '+Number(sl.longitude).toFixed(5):'-';const ec=el?Number(el.latitude).toFixed(5)+', '+Number(el.longitude).toFixed(5):'-';return `<tr><td>${i+1}</td><td>${sc}</td><td>${ec}</td></tr>`}).join('');const eventRows=events.map(e=>`<tr><td>${esc(ruleName(e.rule&&e.rule.id))}</td><td>${fmtDate(e.activeFrom)}</td><td>${Math.round(parseDurationMs(e.duration)/1000)}s</td><td>${e.maximumSpeed?Math.round(e.maximumSpeed)+' km/h':'-'}</td></tr>`).join('');return `<div class="pdf-page pdf-cover-page"><div class="pdf-topbar"></div><div class="pdf-brand"><h1 class="pdf-title">Fleet Trip 360</h1><div class="pdf-subtitle">Relatorio de viagens</div></div><div class="pdf-grid-4"><div class="pdf-kpi"><small>Veiculo</small><b style="font-size:14px">${vehicle}</b><span>${trips.length} viagens</span></div><div class="pdf-kpi"><small>Periodo</small><b style="font-size:14px">${fmtDate(range.from)} - ${fmtDate(range.to)}</b><span>consulta</span></div><div class="pdf-kpi"><small>Distancia</small><b>${td.dist.toFixed(1)} km</b><span>${td.official?'oficial':'estimado GPS'}</span></div><div class="pdf-kpi"><small>Excecoes</small><b>${events.length}</b><span>periodo</span></div></div><div class="pdf-card" style="margin-top:16px"><div class="pdf-section-title">Resumo</div><div class="pdf-summary-box"><b>Tempo dirigindo:</b> ${Math.round(drive/60000)} min</div><div class="pdf-summary-box"><b>Tempo parado:</b> ${Math.round(stop/60000)} min</div><div class="pdf-summary-box"><b>Gerado em:</b> ${generatedAt}</div></div><div class="pdf-footer"><span>Fleet Trip 360 - Viagens</span><span>Pagina 1</span></div></div><div class="pdf-page"><div class="pdf-topbar"></div><div class="pdf-brand"><h1 class="pdf-title">Viagens</h1><div class="pdf-subtitle">Historico detalhado</div></div><table class="pdf-table"><thead><tr><th>#</th><th>Inicio</th><th>Termino</th><th>Condutor</th><th>km</th><th>Media</th><th>Max</th><th>Exc.</th></tr></thead><tbody>${tripRows||'<tr><td colspan="8">Sem viagens.</td></tr>'}</tbody></table><div class="pdf-footer"><span>Fleet Trip 360 - Viagens</span><span>Pagina 2</span></div></div><div class="pdf-page"><div class="pdf-topbar"></div><div class="pdf-brand"><h1 class="pdf-title">Inicio e fim do trajeto</h1><div class="pdf-subtitle">Coordenadas dos pontos inicial e final</div></div><table class="pdf-table"><thead><tr><th>#</th><th>Inicio (lat, lon)</th><th>Fim (lat, lon)</th></tr></thead><tbody>${pointRows||'<tr><td colspan="3">Sem dados.</td></tr>'}</tbody></table><div class="pdf-footer"><span>Fleet Trip 360 - Pontos</span><span>Pagina 3</span></div></div>${events.length?`<div class="pdf-page"><div class="pdf-topbar"></div><div class="pdf-brand"><h1 class="pdf-title">Excecoes</h1><div class="pdf-subtitle">Eventos agrupados</div></div><table class="pdf-table"><thead><tr><th>Regra</th><th>Inicio</th><th>Duracao</th><th>Velocidade</th></tr></thead><tbody>${eventRows}</tbody></table><div class="pdf-footer"><span>Fleet Trip 360 - Excecoes</span><span>Pagina 3</span></div></div>`:''}`;}
async function exportPdf(){if(!trips.length){alertMsg('Carregue as viagens antes de gerar o PDF.',false,true);return}let printOptions={includeLogo:false,logo:''};if(window.PrintOptions){try{printOptions=await window.PrintOptions.ask({title:'Imprimir Fleet Trip 360',subtitle:'Inclua um logo no cabecalho e rodapes do PDF.'})}catch(e){printOptions={includeLogo:false,logo:''}}if(printOptions===null) return}const logo=printOptions&&printOptions.includeLogo?printOptions.logo:'';const tmp=document.createElement('div');tmp.innerHTML=buildTripPdf();if(window.PrintOptions) window.PrintOptions.decorate(tmp,logo);const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fleet Trip 360</title><link rel="stylesheet" href="./reports/premium.css?v=0.1.3"><style>body{background:#fff;padding:0}.pdf-stage{display:block}</style></head><body><div class="pdf-stage">'+tmp.innerHTML+'</div><script>setTimeout(function(){window.print()},700)<\/script></body></html>';const w=window.open('','_blank');if(!w){alertMsg('Permita pop-ups para abrir o PDF.',false,true);return}w.document.open();w.document.write(html);w.document.close();}
window.geotab=window.geotab||{};window.geotab.addin=window.geotab.addin||{};window.geotab.addin.fleetTrip360=function(){return{initialize:function(api,state,cb){try{init(api)}catch(e){console.error(e)}if(cb)cb()},focus:function(){if(map)setTimeout(()=>map.invalidateSize(),200)},blur:function(){}}}
function init(api){if(!api){setStatus('Nao conectado');alertMsg('Abra este add-in dentro do MyGeotab para carregar dados reais.',false,true);return}apiRef=api;shell();loadDevices()}
</script>
</body>
</html>
